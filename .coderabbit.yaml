language: en-GB
reviews:
  profile: chill
  review_status: true
  auto_review:
    enabled: true
    drafts: false
    # CodeRabbit auto-reviews only pull requests into the default branch
    # unless the base is listed here. main advances by fast-forward alone
    # (ADR-0004), so every pull request in this repository targets develop.
    base_branches:
      - develop
  # The judgment half of the comment standard. scripts/check-comment-style.mjs
  # rejects what a regex can see; the reviewer reads the rest of
  # docs/comments.md against every comment the pull request adds or changes
  # (TYRE-237).
  path_instructions:
    - path: "{api,db,web,infra,scripts,.github}/**"
      instructions: |
        Review every added or changed comment against docs/comments.md.
        Flag a comment that restates the line below it, narrates a change
        or a review conversation, duplicates a rationale that has a
        canonical home in another file, or is longer than its load-bearing
        content. A comment stating a domain rule about tyres, valuation,
        inspections or tenancy must cite a requirement ID (FR-, NFR-, CR-,
        BR-, DR-), a sponsor change or clarification (CHG-, CFL-, both of
        which carry the same weight as an FR- and are used throughout
        db/migrations) or a ticket (TYRE-, OI-); the IDs come from the SRS in
        Confluence, so treat an ID that does not look like one already used
        in the repo as suspect. Prose in comments and user-facing strings
        follows the Prose section: no em dashes, straight quotes, plain
        words, one idea per sentence.
