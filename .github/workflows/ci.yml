name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# A pull_request run executes repo scripts (seed generators, the comment
# checker, npm lifecycle) against the token it is handed. Read-only is all any
# job here needs, except the deploy jobs, which grant their own id-token: write
# for OIDC (TYRE-79). Without this block the run inherits whatever the
# repository default grants, which is a write token on many settings (TYRE-50).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A develop run may be deploying staging and a main run production;
  # cancelling either mid-rollout would strand a half-applied release
  # (TYRE-79, TYRE-397). Every other ref still cancels.
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/main' }}

jobs:
  database:
    name: Schema, isolation and valuation
    runs-on: ubuntu-latest
    timeout-minutes: 5 # TYRE-478; docs/superpowers/specs/2026-11-11-bounded-lead-waits-design.md, CI
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tyre
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      # Actions are pinned to commit SHAs, not tags (TYRE-50): a tag is a
      # movable pointer another party can repoint at new code. Renovate bumps
      # these SHAs; the trailing comment is the human-readable version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.12' }

      # The generators are the single source of truth for the axle
      # configuration library (db/CLAUDE.md). The ruff pin here must equal
      # required-version in db/seeds/ruff.toml (TYRE-163, TYRE-311).
      - name: Python format and lint (db/seeds)
        run: |
          pip install --quiet ruff==0.16.8
          ruff format --check db/seeds
          ruff check db/seeds

      - name: Regenerate seeds
        run: cd db/seeds && python3 gen_seed_configurations.py && python3 gen_seed_fixture.py && python3 gen_seed_volume.py && python3 gen_seed_demo.py

      # The generators are the single source of truth for the axle
      # configuration library; a byte-stream difference on regeneration is
      # the drift Appendix I exists to prevent.
      - name: Seeds are deterministic
        run: |
          sha_a=$(sha256sum db/seeds/002_seed_configurations.sql db/seeds/003_seed_fixture.sql db/seeds/006_seed_volume.sql db/seeds/demo_tenant.sql)
          cd db/seeds && python3 gen_seed_configurations.py && python3 gen_seed_fixture.py && python3 gen_seed_volume.py && python3 gen_seed_demo.py && cd ../..
          sha_b=$(sha256sum db/seeds/002_seed_configurations.sql db/seeds/003_seed_fixture.sql db/seeds/006_seed_volume.sql db/seeds/demo_tenant.sql)
          [ "$sha_a" = "$sha_b" ] || { echo "::error::seed generation is not deterministic"; exit 1; }

      # Same image `make db-migrate` uses locally, so a migration that works
      # on a laptop works here, and schema_migrations versioning is exercised
      # on every build, not just in production.
      - name: Run migrations
        run: |
          docker run --rm --network host \
            -v "$PWD/db/migrations:/migrations:ro" \
            migrate/migrate:v4.20.1@sha256:76cc2074cb6642631f34a898ced71e6aeaa6b1a4d78c4daa743275a22e0c5be7 \
            -path=/migrations \
            -database "postgres://postgres:postgres@localhost:5433/tyre?sslmode=disable" up

      - name: Load seeds
        env:
          PGURL: postgres://postgres:postgres@localhost:5433/tyre
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -q -f db/seeds/002_seed_configurations.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -q -f db/seeds/003_seed_fixture.sql

      # NFR-SEC-005: runs as app_login, not postgres, which would bypass RLS
      # (db/CLAUDE.md). Check 0 in the suite asserts this.
      - name: Verification suite (as non-superuser)
        env:
          PGURL: postgres://app_login@localhost:5433/tyre
        run: |
          psql "postgres://postgres:postgres@localhost:5433/tyre" -q \
            -c "ALTER ROLE app_login PASSWORD 'ci'"
          PGPASSWORD=ci psql "$PGURL" -v ON_ERROR_STOP=1 -f db/tests/004_tests.sql

      # A step of its own, after the suite, because it runs as postgres and so
      # proves nothing about RLS. What it stages and why is the header of
      # db/tests/005_privileged.sql (TYRE-38, B7 spec U12).
      - name: Privileged negative controls (as postgres)
        run: |
          psql "postgres://postgres:postgres@localhost:5433/tyre" -v ON_ERROR_STOP=1 -f db/tests/005_privileged.sql

      # make db-provision-test's proof (Makefile), on databases of its own.
      - name: Tenant provisioning and the demonstration load (TYRE-374)
        env:
          PGPASSWORD: postgres
          PSQL: psql -h localhost -p 5433 -U postgres
          MIGRATE: docker run --rm --network host -v ${{ github.workspace }}/db/migrations:/migrations:ro migrate/migrate:v4.20.1@sha256:76cc2074cb6642631f34a898ced71e6aeaa6b1a4d78c4daa743275a22e0c5be7 -path=/migrations
          PG_HOSTPORT: localhost:5433
          PYTHON: python3
        run: bash scripts/provision-tenant.test.sh

  comments:
    name: Comment style
    runs-on: ubuntu-latest
    timeout-minutes: 5 # TYRE-478; docs/superpowers/specs/2026-11-11-bounded-lead-waits-design.md, CI
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Regression cases for the RULES patterns themselves (TYRE-192), before
      # the run that judges this tree.
      - name: Comment standard regression cases
        run: node scripts/check-comment-style.test.mjs
      # Same script the edit hook and `make lint` run, so a comment that slips
      # past both locally still cannot merge (docs/comments.md, TYRE-22).
      - name: Comment standard (deterministic subset)
        run: node scripts/check-comment-style.mjs

  infra:
    name: Infrastructure and workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5 # TYRE-478; docs/superpowers/specs/2026-11-11-bounded-lead-waits-design.md, CI
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same targets make lint and make test run, so a template or workflow
      # that would fail at deploy time fails here first (TYRE-79).
      - name: Bicep and workflow lint
        run: make infra-lint
      - name: Deploy gate cases
        run: make deploy-gate-test
      - name: Deploy guard cases
        run: make deploy-guard-test
      - name: Deploy smoke cases
        run: make deploy-smoke-test
      - name: Pipeline launcher cases
        run: make pipeline-launch-test
      - name: Pipeline review script cases
        run: make pipeline-review-test
      - name: Pipeline wait cases
        run: make pipeline-wait-test
      - name: Hook cases
        run: make hooks-test
      - name: Guard check cases
        run: make guard-check-test

  api:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 10 # TYRE-478; docs/superpowers/specs/2026-11-11-bounded-lead-waits-design.md, CI
    # The store and httpapi tests are integration tests against RLS itself.
    # A mocked database cannot fail a policy, so this job carries the same
    # migrated Postgres the database job uses. Seeded, since B7.2 (TYRE-36):
    # the analytics tests pin the API against the same Appendix E and J
    # figures the suite pins, which live in the BAC fixture. Everything else
    # the tests need they still plant in throwaway tenants.
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tyre
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache-dependency-path: api/go.sum
      - name: Migrate and seed
        run: |
          cd db/seeds && python3 gen_seed_configurations.py && python3 gen_seed_fixture.py && cd ../..
          docker run --rm --network host \
            -v "$PWD/db/migrations:/migrations:ro" \
            migrate/migrate:v4.20.1@sha256:76cc2074cb6642631f34a898ced71e6aeaa6b1a4d78c4daa743275a22e0c5be7 \
            -path=/migrations \
            -database "postgres://postgres:postgres@localhost:5433/tyre?sslmode=disable" up
          PGURL="postgres://postgres:postgres@localhost:5433/tyre"
          psql "$PGURL" -v ON_ERROR_STOP=1 -q -f db/seeds/002_seed_configurations.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -q -f db/seeds/003_seed_fixture.sql
          psql "$PGURL" -q -c "ALTER ROLE app_login PASSWORD 'ci'"
      - name: Build, vet, staticcheck, test
        env:
          TEST_DATABASE_URL: postgres://app_login:ci@localhost:5433/tyre?sslmode=disable
          TEST_ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5433/tyre?sslmode=disable
        run: |
          node scripts/check-go-pins.mjs --self-test
          node scripts/check-go-pins.mjs
          node scripts/check-money-types.mjs --self-test
          node scripts/check-money-types.mjs
          cd api
          gofmt -l . | tee /tmp/fmt && [ ! -s /tmp/fmt ] || { echo "::error::run gofmt"; exit 1; }
          go vet -tags devheader ./...
          go tool staticcheck -tags devheader ./...
          go build -tags devheader ./...
          go test -tags devheader -race ./...
      # U103: api/Dockerfile's build stage checks the binary the image ships.
      # deploy.yml's image build runs the same stage.
      - name: Release binary names no dev header
        run: docker build --target build api

  web:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10 # TYRE-478; docs/superpowers/specs/2026-11-11-bounded-lead-waits-design.md, CI
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: web/.nvmrc, cache: npm, cache-dependency-path: web/package-lock.json }

      # TYRE-21: node 22 bundles npm 10.9.9, which predates min-release-age
      # (11.10.0) and would silently enforce nothing. Pinned, not @latest,
      # since this is itself a supply-chain concern.
      - name: Pin npm
        run: npm i -g npm@12.0.2

      # Both checks are needed: `npm config get` echoes any key present in
      # .npmrc whether or not npm understands it, so the value alone proves
      # only that the file was read; the version comparison proves the gate
      # is enforced (TYRE-21).
      - name: Release-age gate is active
        run: |
          cd web
          age=$(npm config get min-release-age)
          [ "$age" = "14" ] || { echo "::error::min-release-age is '$age', expected 14. web/.npmrc not read"; exit 1; }
          have=$(npm -v); need=11.10.0
          [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -1)" = "$need" ] \
            || { echo "::error::npm $have ignores min-release-age; need >= $need"; exit 1; }
          echo "min-release-age=$age enforced by npm $have"

      # TYRE-21: the gate above proves npm would enforce the window; this
      # proves the lockfile in the tree does, a different claim (full
      # rationale in scripts/check-release-age.mjs). Runs before install.
      - name: Locked packages are old enough
        run: node scripts/check-release-age.mjs

      # The same commands `make lint` and `make test` run locally, spelled
      # out rather than delegated to make: the runner has no docker-based Go
      # toolchain to hand and this job is web-only. No `--if-present` on any of
      # them. A missing script must fail the build, not pass silently
      # (TYRE-49).
      - name: Format, lint, typecheck, test, bundle
        run: |
          cd web
          npm ci
          npm run format:check
          npm run lint
          npm run lint:css
          npm run typecheck
          npm test
          npm run build
          npm run bundle:check -- --self-test
          npm run bundle:check
          node ../scripts/check-dist-dev-strings.mjs --self-test
          node ../scripts/check-dist-dev-strings.mjs
          node ../scripts/check-dist-sign-in.mjs --self-test
          node ../scripts/check-dist-sign-in.mjs
          node ../scripts/write-web-config.mjs --self-test

  # Puts each PR's change in the three entry figures in front of the reviewer
  # (U84, U200). Its own job, so the Frontend job's web/dist is never rebuilt
  # from another commit (TYRE-474).
  bundle-size:
    name: Capture bundle size
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10 # TYRE-474; docs/superpowers/specs/2026-11-12-capture-bundle-ceilings-design.md, CI
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: web/.nvmrc, cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Pin npm
        run: npm i -g npm@12.0.2
      - name: This PR's figures
        run: |
          cd web
          npm ci
          npm run build
          node ../scripts/check-capture-bundle.mjs --figures dist > "$RUNNER_TEMP/pr.json"
      # A pull_request run checks out the merge commit, whose first parent is
      # the base branch's tip; the guard refuses any other checkout (TYRE-474
      # spec, CI). The PR's script measures the base, so the last line runs
      # $GITHUB_WORKSPACE's copy.
      - name: The base's figures
        run: |
          git rev-parse --verify --quiet HEAD^2 > /dev/null \
            || { echo "::error::HEAD is not a merge commit, so HEAD^ is not the base branch's tip"; exit 1; }
          echo "base $(git rev-parse --short HEAD^), this PR's merge commit $(git rev-parse --short HEAD)"
          git worktree add --detach "$RUNNER_TEMP/base" HEAD^
          cd "$RUNNER_TEMP/base/web"
          npm ci
          npm run build
          node "$GITHUB_WORKSPACE/scripts/check-capture-bundle.mjs" --figures dist > "$RUNNER_TEMP/base.json"
      - name: Size report
        run: node scripts/check-capture-bundle.mjs --report "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/pr.json"

  e2e:
    name: Browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20 # TYRE-478; docs/superpowers/specs/2026-11-11-bounded-lead-waits-design.md, CI
    # The one job that runs the real stack end to end (seeded Postgres, the
    # API, vite dev server, headless Chromium and WebKit): jsdom cannot
    # exercise real rendering, and deploy-staging below needs it (TYRE-65).
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tyre
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.12' }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache-dependency-path: api/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: web/.nvmrc, cache: npm, cache-dependency-path: web/package-lock.json }

      # Same migrated-and-seeded database the schema job builds: the smoke
      # spec asserts against seeded fixture rows (HORSE, the dev actors).
      - name: Migrate and seed
        run: |
          cd db/seeds && python3 gen_seed_configurations.py && python3 gen_seed_fixture.py && cd ../..
          docker run --rm --network host \
            -v "$PWD/db/migrations:/migrations:ro" \
            migrate/migrate:v4.20.1@sha256:76cc2074cb6642631f34a898ced71e6aeaa6b1a4d78c4daa743275a22e0c5be7 \
            -path=/migrations \
            -database "postgres://postgres:postgres@localhost:5433/tyre?sslmode=disable" up
          PGURL="postgres://postgres:postgres@localhost:5433/tyre"
          psql "$PGURL" -v ON_ERROR_STOP=1 -q -f db/seeds/002_seed_configurations.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -q -f db/seeds/003_seed_fixture.sql
          psql "$PGURL" -q -c "ALTER ROLE app_login PASSWORD 'ci'"

      # APP_DEV_TENANT_HEADER is safe here for the same reason it is safe on a
      # laptop: this API exists for minutes, listens on the runner's loopback,
      # and CONTAINER_APP_NAME vetoes the flag in any deployed revision.
      # -tags devheader: the release binary has no header resolver (U103).
      - name: Start the API
        env:
          DATABASE_URL: postgres://app_login:ci@localhost:5433/tyre?sslmode=disable
          APP_DEV_TENANT_HEADER: '1'
        run: |
          cd api
          go run -tags devheader ./cmd/api &
          for _ in $(seq 1 60); do
            curl -s -o /dev/null http://localhost:8080/api/me && exit 0
            sleep 1
          done
          echo "::error::API did not start within 60s"; exit 1

      - name: Browser smoke tests
        run: |
          cd web
          npm ci
          npx playwright install --with-deps chromium webkit
          npm run e2e

      # The production bundle under the deploy's own headers and config.json,
      # with every identity provider and API call stubbed (TYRE-51). The step
      # above installed the browsers.
      - name: Production bundle under its CSP
        run: |
          cd web
          npm run e2e:production

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: web/test-results/
          retention-days: 7

  # Deploys staging from inside CI's own run, so github.ref is develop and the
  # staging environment's branch rule admits it; a workflow_run trigger would
  # run as main (TYRE-79, ADR-0017). Every gate job must pass first.
  deploy-staging:
    name: Deploy staging
    needs: [database, comments, infra, api, web, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      id-token: write
      contents: read
    # This group keeps CI deploys single. A dispatch is kept apart by
    # deploy.yml's job-level groups, which GitHub's docs do not say are
    # honoured inside a called workflow; the first runs confirm it (TYRE-79).
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    uses: ./.github/workflows/deploy.yml
    with:
      target: staging

  # Production deploys only from main (ADR-0017); scripts/deploy-guard.sh
  # holds the refusals that make that safe.
  deploy-prod:
    name: Deploy production
    needs: [database, comments, infra, api, web, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    uses: ./.github/workflows/deploy.yml
    with:
      target: prod
