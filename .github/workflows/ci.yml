name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# A pull_request run executes repo scripts (seed generators, the comment
# checker, npm lifecycle) against the token it is handed. Read-only is all any
# job here needs; without this block the run inherits whatever the repository
# default grants, which is a write token on many settings (TYRE-50).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Schema, isolation and valuation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tyre
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      # Actions are pinned to commit SHAs, not tags. A tag is a movable
      # pointer: whoever can push to the action's repository can repoint v7 at
      # new code that runs inside our job. This repo already refuses npm
      # packages younger than 14 days (web/.npmrc) — an action is the same
      # threat model with more privilege, because it executes rather than just
      # ships bytes. Renovate bumps these SHAs; the trailing comment is the
      # human-readable version it keys off (TYRE-50).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.12' }

      - name: Regenerate seeds
        run: cd db/seeds && python3 gen_seed_configurations.py && python3 gen_seed_fixture.py

      # The generators are deterministic and are the single source of truth for
      # the axle configuration library. If regenerating produces a different
      # byte stream from the last run, the library changed without the SRS
      # changing, which is exactly the drift Appendix I exists to prevent.
      - name: Seeds are deterministic
        run: |
          sha_a=$(sha256sum db/seeds/002_seed_configurations.sql db/seeds/003_seed_fixture.sql)
          cd db/seeds && python3 gen_seed_configurations.py && python3 gen_seed_fixture.py && cd ../..
          sha_b=$(sha256sum db/seeds/002_seed_configurations.sql db/seeds/003_seed_fixture.sql)
          [ "$sha_a" = "$sha_b" ] || { echo "::error::seed generation is not deterministic"; exit 1; }

      # Same image `make db-migrate` uses locally, so a migration that works
      # on a laptop works here — and schema_migrations versioning is exercised
      # on every build, not just in production.
      - name: Run migrations
        run: |
          docker run --rm --network host \
            -v "$PWD/db/migrations:/migrations:ro" \
            migrate/migrate:v4.19.1 \
            -path=/migrations \
            -database "postgres://postgres:postgres@localhost:5433/tyre?sslmode=disable" up

      - name: Load seeds
        env:
          PGURL: postgres://postgres:postgres@localhost:5433/tyre
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -q -f db/seeds/002_seed_configurations.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -q -f db/seeds/003_seed_fixture.sql

      # NFR-SEC-005. This is the gate that matters. It runs as app_login, NOT
      # as postgres — superusers bypass RLS (DEPLOYMENT NOTE at the end of
      # db/migrations/000001_init.up.sql). Check 0 inside the suite asserts
      # this and aborts if it is not true.
      - name: Verification suite (as non-superuser)
        env:
          PGURL: postgres://app_login@localhost:5433/tyre
        run: |
          psql "postgres://postgres:postgres@localhost:5433/tyre" -q \
            -c "ALTER ROLE app_login PASSWORD 'ci'"
          PGPASSWORD=ci psql "$PGURL" -v ON_ERROR_STOP=1 -f db/tests/004_tests.sql

  comments:
    name: Comment style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same script the edit hook and `make lint` run, so a comment that slips
      # past both locally still cannot merge (docs/comments.md, TYRE-22).
      - name: Comment standard (deterministic subset)
        run: node scripts/check-comment-style.mjs

  api:
    name: Go
    runs-on: ubuntu-latest
    # The store and httpapi tests are integration tests against RLS itself —
    # a mocked database cannot fail a policy — so this job carries the same
    # migrated Postgres the database job uses. Seeds are not needed: the tests
    # plant their own tenants.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tyre
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24'
          cache-dependency-path: api/go.sum
      - name: Run migrations
        run: |
          docker run --rm --network host \
            -v "$PWD/db/migrations:/migrations:ro" \
            migrate/migrate:v4.19.1 \
            -path=/migrations \
            -database "postgres://postgres:postgres@localhost:5433/tyre?sslmode=disable" up
          psql "postgres://postgres:postgres@localhost:5433/tyre" -q \
            -c "ALTER ROLE app_login PASSWORD 'ci'"
      - name: Build, vet, staticcheck, test
        env:
          TEST_DATABASE_URL: postgres://app_login:ci@localhost:5433/tyre?sslmode=disable
          TEST_ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5433/tyre?sslmode=disable
        run: |
          cd api
          gofmt -l . | tee /tmp/fmt && [ ! -s /tmp/fmt ] || { echo "::error::run gofmt"; exit 1; }
          go vet ./...
          go tool staticcheck ./...
          go build ./...
          go test -race ./...

  web:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json }

      # TYRE-21. node 22 bundles npm 10.9.9, which predates `min-release-age`
      # (npm 11.10.0). npm silently ignores config keys it does not know, so on
      # the bundled npm web/.npmrc would enforce nothing and no one would be
      # told. Pinned rather than @latest: this is a supply-chain ticket, and
      # 12.0.2 satisfies the same 14-day rule it exists to enforce.
      - name: Pin npm
        run: npm i -g npm@12.0.2

      # The guard, not a formality. The failure mode is silent: an npm that does
      # not understand min-release-age installs anyway, with no warning.
      #
      # Both halves are needed. `npm config get` echoes back any key present in
      # .npmrc whether or not npm understands it — npm 9.8.0 reports 14 just as
      # happily as npm 12 does — so the value alone proves only that the file
      # was read. The version comparison is what proves the gate is enforced.
      - name: Release-age gate is active
        run: |
          cd web
          age=$(npm config get min-release-age)
          [ "$age" = "14" ] || { echo "::error::min-release-age is '$age', expected 14 — web/.npmrc not read"; exit 1; }
          have=$(npm -v); need=11.10.0
          [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -1)" = "$need" ] \
            || { echo "::error::npm $have ignores min-release-age; need >= $need"; exit 1; }
          echo "min-release-age=$age enforced by npm $have"

      # TYRE-21. The gate above proves npm *would* enforce the window on the
      # next resolution; this proves the lockfile actually in the tree does,
      # which is a different claim. The full rationale lives at the top of
      # scripts/check-release-age.mjs — one canonical copy. Runs before
      # install so a poisoned lockfile is rejected before any of it is
      # fetched.
      - name: Locked packages are old enough
        run: node scripts/check-release-age.mjs

      # The same four commands `make lint` and `make test` run locally, spelled
      # out rather than delegated to make: the runner has no docker-based Go
      # toolchain to hand and this job is web-only. No `--if-present` on any of
      # them — a missing script must fail the build, not pass silently
      # (TYRE-49).
      - name: Format, lint, typecheck, test
        run: |
          cd web
          npm ci
          npm run format:check
          npm run lint
          npm run typecheck
          npm test

  e2e:
    name: Browser smoke
    runs-on: ubuntu-latest
    # The one job that runs the real stack end to end: seeded Postgres, the
    # API with the dev header resolver, vite's dev server, and headless
    # Chromium and WebKit at desktop and phone viewports. jsdom cannot
    # exercise real rendering, the role landing or a 44px tap target, and the
    # deploy workflow gates on this workflow's conclusion, so a broken
    # login-to-fleet path cannot ship (TYRE-65).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tyre
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.12' }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24'
          cache-dependency-path: api/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json }

      # Same migrated-and-seeded database the schema job builds: the smoke
      # spec asserts against seeded fixture rows (HORSE, the dev actors).
      - name: Migrate and seed
        run: |
          cd db/seeds && python3 gen_seed_configurations.py && python3 gen_seed_fixture.py && cd ../..
          docker run --rm --network host \
            -v "$PWD/db/migrations:/migrations:ro" \
            migrate/migrate:v4.19.1 \
            -path=/migrations \
            -database "postgres://postgres:postgres@localhost:5433/tyre?sslmode=disable" up
          PGURL="postgres://postgres:postgres@localhost:5433/tyre"
          psql "$PGURL" -v ON_ERROR_STOP=1 -q -f db/seeds/002_seed_configurations.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -q -f db/seeds/003_seed_fixture.sql
          psql "$PGURL" -q -c "ALTER ROLE app_login PASSWORD 'ci'"

      # APP_DEV_TENANT_HEADER is safe here for the same reason it is safe on a
      # laptop: this API exists for minutes, listens on the runner's loopback,
      # and CONTAINER_APP_NAME vetoes the flag in any deployed revision.
      - name: Start the API
        env:
          DATABASE_URL: postgres://app_login:ci@localhost:5433/tyre?sslmode=disable
          APP_DEV_TENANT_HEADER: '1'
        run: |
          cd api
          go run ./cmd/api &
          for i in $(seq 1 60); do
            curl -s -o /dev/null http://localhost:8080/api/me && exit 0
            sleep 1
          done
          echo "::error::API did not start within 60s"; exit 1

      - name: Browser smoke tests
        run: |
          cd web
          npm ci
          npx playwright install --with-deps chromium webkit
          npm run e2e

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: web/test-results/
          retention-days: 7
