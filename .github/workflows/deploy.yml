# Releases staging from main (ADR-0004: main only advances by fast-forwarding
# a vetted develop commit, so arriving here IS a release). Staging is
# production for the BAC pilot (ADR-0005).
#
# Auth is OIDC federated credentials on the user-assigned managed identity
# id-tyre-deploy-staging — no long-lived Azure secret exists in this repo.
# The identity holds AcrPush on the registry and Contributor on the resource
# group only.
name: Deploy staging

# CI finishing on main is the trigger, not the push. Triggering on the push
# itself races the verification suite: both start together, and the deploy
# wins. ADR-0004 says the commit was vetted on develop; this is the machine
# checking that claim instead of the release trusting it (TYRE-50).
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# Never run two deploys concurrently; queue instead of cancelling so a
# fast-follow fix cannot kill the release in front of it mid-rollout.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  RG: rg-tyre-staging
  ACR: crtyrestaging
  APP: ca-api-staging
  SWA: stapp-tyre-staging
  # On a workflow_run event github.sha is the default branch's head at the
  # moment this workflow starts, not the commit CI actually verified. Deploying
  # that would ship an unverified fast-follow push. head_sha is the commit CI
  # ran against; the fallback covers workflow_dispatch, which has no run to
  # inherit from.
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

# A workflow_run fires on every completion, failure included, so the
# conclusion is the gate. workflow_dispatch carries no conclusion — the manual
# path stays open for a rollback when CI is red.
jobs:
  api:
    name: API image
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit SHA for the reason set out at the top of the
      # database job in ci.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image
        run: |
          az acr login --name "$ACR"
          image="$ACR.azurecr.io/tyre-api:$DEPLOY_SHA"
          docker build -t "$image" api
          docker push "$image"

      # The image on the live app is owned by this workflow, not by Bicep: a
      # template redeploy would revert it to whatever infra/main.bicep names.
      - name: Deploy to Container Apps
        run: |
          az extension add -n containerapp --upgrade
          az containerapp update -g "$RG" -n "$APP" \
            --image "$ACR.azurecr.io/tyre-api:$DEPLOY_SHA"

      # Hit the app through its public FQDN, not the revision URL: this is the
      # path a driver's phone takes, including a cold start from zero replicas.
      - name: Health check
        run: |
          fqdn=$(az containerapp show -g "$RG" -n "$APP" \
                   --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$fqdn/healthz" || true)
            [ "$code" = "200" ] && { echo "healthy after $i checks"; exit 0; }
            sleep 5
          done
          echo "::error::/healthz never returned 200 (last=$code)"
          exit 1

  web:
    name: Web to Static Web Apps
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build
        run: |
          cd web
          npm ci
          npm run build

      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The SWA deployment token is fetched fresh via OIDC each run instead of
      # living in repo secrets: one less credential that can go stale or leak.
      # add-mask before it touches an output so the log can never show it.
      - name: Get deployment token
        id: swa
        run: |
          key=$(az staticwebapp secrets list -n "$SWA" -g "$RG" \
                  --query properties.apiKey -o tsv)
          echo "::add-mask::$key"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      # The third-party action in the job holding the OIDC token, so the one
      # that most needed pinning. This repository carries both a `v1` tag and a
      # `v1` branch, three years apart, and the runner resolves `@v1` to the
      # tag — so the tag's SHA is the pin that preserves behaviour. TYRE-53
      # holds the decision about moving to the branch.
      - uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.key }}
          action: upload
          app_location: web/dist
          skip_app_build: true
          skip_api_build: true
