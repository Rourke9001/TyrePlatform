# Local development database. Deliberately Postgres 16 to match the target
# Azure Database for PostgreSQL Flexible Server version. RLS and
# security_invoker behaviour must be identical between local and deployed.
services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    container_name: tyre-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tyre
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Migration runner. Not started by default (profile: tools). Invoked by
  # `make db-migrate` / `make db-reset`. Same image family CI uses, so a
  # migration that works locally works in the pipeline.
  migrate:
    image: migrate/migrate:v4.19.1@sha256:cc4ad8e19d66791e3689405d9a028ce6e9614f32032db14acda1469f7201d6e4
    profiles: ["tools"]
    volumes:
      - ./db/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
